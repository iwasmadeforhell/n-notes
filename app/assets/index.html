<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N.Notes</title>
<style>
:root{--bg:#0b0d12;--p:#141822;--l:#222838;--t:#e8eaf0;--m:#7c8499;--a:#c3b1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:var(--bg);display:flex;gap:6px;padding:12px;z-index:5}
header button{flex:1;background:none;border:0;color:var(--m);font:600 15px system-ui,sans-serif;padding:10px;border-radius:10px}
header button.on{background:var(--p);color:var(--a)}
main{padding:0 12px;max-width:560px;margin:auto}
input,button{font:inherit;color:inherit}
input{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:10px;min-width:0}
.btn{background:var(--a);color:#14101f;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.row{display:flex;gap:8px;margin:8px 0}.row input{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:8px 0}
.cal b{color:var(--m);font-size:12px;font-weight:500}
.d{aspect-ratio:1;border-radius:10px;background:none;border:0;position:relative}
.d.sel{background:var(--a);color:#14101f;font-weight:700}
.d.today{outline:1px solid var(--a)}
.d i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a)}
.d.sel i{background:#14101f}
.nav{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.nav button{background:none;border:0;font-size:22px;padding:6px 14px;color:var(--m)}
.card{background:var(--p);border-radius:14px;padding:12px;margin:10px 0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}
.item:last-child{border:0}.item span{flex:1}.done{color:var(--m);text-decoration:line-through}
.x{background:none;border:0;color:var(--m);font-size:18px;padding:0 6px}
.chk{width:22px;height:22px;accent-color:var(--a)}
h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.set{background:var(--l);border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.set small{color:var(--a)}
.hint{color:var(--m);font-size:13px}
.set{display:inline-flex;align-items:center;gap:6px}
.set .x{padding:0 2px;font-size:15px}
.x.arm{color:#ff7b7b;font-weight:700;font-size:14px}
.logo{width:32px;height:32px;flex:none;align-self:center}
#toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:536px;margin:auto;background:var(--l);border-radius:12px;padding:12px 14px;display:none;justify-content:space-between;align-items:center;z-index:9}
#toast button{background:none;border:0;color:var(--a);font-weight:700}
.n{width:64px;flex:none!important;text-align:center}
.note{width:100%;font-size:13px;color:var(--m)}
.side{background:var(--l);border:0;border-radius:10px;padding:0 10px;color:var(--m)}
.side.on{color:var(--a)}
.dt{display:flex;gap:8px;align-items:center;margin:4px 0}.dt input{flex:1}
.arrow{background:none;border:0;font-size:22px;padding:6px 12px;color:var(--m)}
</style></head><body>
<header><svg class="logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#141822"/><path d="M26 72V28L58 72V28" fill="none" stroke="#c3b1ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="70" r="6" fill="#fff"/></svg><button id="t0" class="on">To-do</button><button id="t1">Gym</button></header>
<main id="v"></main><div id="toast"><span></span><button>Undo</button></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let D;
try{D=JSON.parse(localStorage.getItem('nn'))}catch(e){}
if(!D){
  const S='2026-10-04';let id=0;
  const ex=n=>({id:'e'+(++id),name:n,note:''});
  const chest=ex('Chest press'),lat=ex('Lateral raise'),pull=ex('Lat pulldown (one hand)'),
        curl=ex('Bicep curl (chair, mode 2)'),zer=ex('Zercher'),leg=ex('Leg press (one leg)');
  pull.note='10x32 doable, or 39 next';
  const L=[];const s=(e,reps,kg,side)=>L.push({date:S,ex:e.id,reps,kg,side:side||''});
  s(chest,7,52);s(chest,9,45);s(lat,15,7);s(pull,8,32);
  s(curl,10,7,'R');s(curl,5,7,'R');s(curl,5,7,'L');s(curl,5,7,'L');s(zer,5,80);
  D={todos:[],ex:[chest,lat,pull,curl,zer,leg],log:L};
}
const save=()=>{try{localStorage.setItem('nn',JSON.stringify(D))}catch(e){}};
let tab=0,sel=iso(new Date()),cur=new Date();cur.setDate(1);
let gdate=iso(new Date());
const SEEDDAY='2026-10-04';
$('#t0').onclick=()=>{tab=0;render()};$('#t1').onclick=()=>{tab=1;render()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  $('#t0').className=tab?'':'on';$('#t1').className=tab?'on':'';
  tab?gym():todo();
}
function todo(){
  const y=cur.getFullYear(),m=cur.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const has=new Set(D.todos.filter(t=>!t.done).map(t=>t.date)),today=iso(new Date());
  let g='';['M','T','W','T','F','S','S'].forEach(x=>g+='<b>'+x+'</b>');
  for(let i=0;i<first;i++)g+='<span></span>';
  for(let d=1;d<=days;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);
    g+=`<button class="d${k==sel?' sel':''}${k==today?' today':''}" data-d="${k}">${d}${has.has(k)?'<i></i>':''}</button>`}
  const list=D.todos.filter(t=>t.date==sel);
  $('#v').innerHTML=`<div class="nav"><button id="pm">‹</button>${cur.toLocaleString('en',{month:'long',year:'numeric'})}<button id="nm">›</button></div>
  <div class="cal">${g}</div>
  <div class="row"><input id="ti" placeholder="New task for ${sel}"><button class="btn" id="ta">Add</button></div>
  <div class="card">${list.length?list.map(t=>`<div class="item"><input type="checkbox" class="chk" data-c="${t.id}" ${t.done?'checked':''}><span class="${t.done?'done':''}">${esc(t.text)}</span><button class="x" data-x="${t.id}">✕</button></div>`).join(''):'<div class="hint">Nothing planned.</div>'}</div>`;
  $('#pm').onclick=()=>{cur.setMonth(m-1);render()};$('#nm').onclick=()=>{cur.setMonth(m+1);render()};
  document.querySelectorAll('.d').forEach(b=>b.onclick=()=>{sel=b.dataset.d;render()});
  const add=()=>{const v=$('#ti').value.trim();if(!v)return;D.todos.push({id:Date.now()+'',text:v,date:sel,done:false});save();render()};
  $('#ta').onclick=add;$('#ti').onkeydown=e=>{if(e.key=='Enter')add()};
  document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{D.todos.find(t=>t.id==c.dataset.c).done=c.checked;save();render()});
  document.querySelectorAll('[data-x]').forEach(c=>c.onclick=()=>{D.todos=D.todos.filter(t=>t.id!=c.dataset.x);save();render()});
}
const sideState={};let armed=null,tt;
function undo(msg,fn){const t=$('#toast');t.firstChild.textContent=msg;t.style.display='flex';
  t.lastChild.onclick=()=>{clearTimeout(tt);t.style.display='none';fn()};clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',6000)}
function lastSet(e){const l=D.log.filter(x=>x.ex==e.id&&x.date<=gdate);return l[l.length-1]}
function gym(){
  armed=null;
  const cards=D.ex.map(e=>{
    const sets=D.log.map((x,i)=>({...x,i})).filter(x=>x.ex==e.id&&x.date==gdate);
    const ls=lastSet(e);
    const hasSide=sets.some(s=>s.side)||sideState[e.id];
    return `<div class="card"><h3>${esc(e.name)}<button class="x" data-del="${e.id}">✕</button></h3>
    <div class="sets">${sets.map((s,n)=>`<span class="set">${n+1}. ${s.reps}×${s.kg}kg${s.side?` <small>${s.side}</small>`:''}<button class="x" data-rm="${s.i}">✕</button></span>`).join('')||'<span class="hint">No sets this day</span>'}</div>
    <div class="row" style="align-items:center"><input class="n" type="number" inputmode="numeric" placeholder="reps" id="r${e.id}" value="${ls?ls.reps:''}">×
      <input class="n" type="number" inputmode="decimal" placeholder="kg" id="k${e.id}" value="${ls?ls.kg:''}">
      ${hasSide?`<button class="side on" data-side="${e.id}" id="s${e.id}">${sideState[e.id]||(sets.length&&sets[sets.length-1].side)||'R'}</button>`:`<button class="side" data-tog="${e.id}">L/R</button>`}
      <button class="btn" data-add="${e.id}">+ Set</button></div>
    <input class="note" data-note="${e.id}" placeholder="note" value="${esc(e.note)}"></div>`}).join('');
  $('#v').innerHTML=`<div class="dt"><button class="arrow" id="gp">‹</button><input type="date" id="gd" value="${gdate}"><button class="arrow" id="gn">›</button></div>${cards}
  <div class="row"><input id="ne" placeholder="New exercise"><button class="btn" id="na">Add</button></div>`;
  const shift=n=>{const d=new Date(gdate+'T12:00');d.setDate(d.getDate()+n);gdate=iso(d);render()};
  $('#gp').onclick=()=>shift(-1);$('#gn').onclick=()=>shift(1);
  $('#gd').onchange=e=>{if(e.target.value){gdate=e.target.value;render()}};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add;
    const r=+$('#r'+id).value,k=+$('#k'+id).value;if(!r)return;
    const s=$('#s'+id);D.log.push({date:gdate,ex:id,reps:r,kg:k||0,side:s?s.textContent:''});save();render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rm,it=D.log.splice(i,1)[0];save();render();undo('Set deleted',()=>{D.log.splice(i,0,it);save();render()})});
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{sideState[b.dataset.tog]='R';render()});
  document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{const id=b.dataset.side;
    const r=$('#r'+id).value,k=$('#k'+id).value;
    sideState[id]=b.textContent=='R'?'L':'R';render();
    $('#r'+id).value=r;$('#k'+id).value=k});
  document.querySelectorAll('[data-note]').forEach(i=>i.onchange=()=>{D.ex.find(e=>e.id==i.dataset.note).note=i.value;save()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(armed!=b.dataset.del){armed=b.dataset.del;b.textContent='Delete?';b.className='x arm';return}
    armed=null;D.ex=D.ex.filter(e=>e.id!=b.dataset.del);D.log=D.log.filter(x=>x.ex!=b.dataset.del);save();render()});
  const add=()=>{const v=$('#ne').value.trim();if(!v)return;D.ex.push({id:'e'+Date.now(),name:v,note:''});save();render()};
  $('#na').onclick=add;
}
save();
if(!D.log.some(x=>x.date==gdate)&&D.log.some(x=>x.date==SEEDDAY))gdate=SEEDDAY;
render();
</script></body></html>
